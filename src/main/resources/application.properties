# =============================================================================
# NoteHive configuration. Every ${VAR:default} is environment-driven so no
# secrets live in Git. Defaults target local docker-compose (see deploy/).
# =============================================================================

quarkus.application.name=notehive
quarkus.banner.enabled=false

# ---------------------------------------------------------------- datasource
# default DS = RLS-bound application role; worker DS = BYPASSRLS role, used
# ONLY for cross-tenant maintenance (bloom rebuild, retention jobs).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:notehive_app}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:notehive_app_pw}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/notehive?stringtype=unspecified}
# stringtype=unspecified: pgjdbc sends varchar params as untyped so the server
# infers the target column type — required for jsonb entity fields (outbox
# payload); harmless for every other column.
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.jdbc.idle-removal-interval=5M
quarkus.datasource.jdbc.max-lifetime=30M
quarkus.datasource.jdbc.leak-detection-interval=60S
quarkus.datasource.jdbc.validation-query-sql=SELECT 1

quarkus.datasource."worker".db-kind=postgresql
quarkus.datasource."worker".username=${NOTEHIVE_WORKER_DB_USERNAME:notehive_worker}
quarkus.datasource."worker".password=${NOTEHIVE_WORKER_DB_PASSWORD:notehive_worker_pw}
quarkus.datasource."worker".jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/notehive?stringtype=unspecified}
quarkus.datasource."worker".jdbc.min-size=1
quarkus.datasource."worker".jdbc.max-size=5

# ------------------------------------------------------------------- flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------- hibernate
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.active=true

# ------------------------------------------------------------- event backbone
notehive.events.redis-url=${NOTEHIVE_REDIS_URL:redis://localhost:6379/0}
notehive.events.stream=notehive:events
notehive.events.dlq-stream=notehive:events:dlq
notehive.events.maxlen=1000000
notehive.events.relay-batch-size=100
notehive.events.relay-poll-interval=2s
notehive.events.max-publish-attempts=8
notehive.events.backoff-base=500ms
notehive.events.consumer-batch-size=200
notehive.events.poll-block-time=2s
notehive.events.handler-concurrency=8
notehive.events.max-in-flight=256
notehive.events.claim-min-idle=60s
notehive.events.max-delivery-attempts=10
# consumer identity MUST be unique per replica (default: hostname)
notehive.events.consumer-id=${HOSTNAME:notehive-single}

# ------------------------------------------------------------------- jwt
notehive.jwt.issuer=${NOTEHIVE_JWT_ISSUER:notehive}
notehive.jwt.audience=${NOTEHIVE_JWT_AUDIENCE:notehive-api}
notehive.jwt.key-mode=${NOTEHIVE_JWT_KEY_MODE:static}
notehive.jwt.public-key-pem=${NOTEHIVE_JWT_PUBLIC_KEY_PEM:}
notehive.jwt.private-key-pem=${NOTEHIVE_JWT_PRIVATE_KEY_PEM:}
notehive.jwt.jwks-url=${NOTEHIVE_JWT_JWKS_URL:}
notehive.jwt.dev-key-dir=${NOTEHIVE_JWT_DEV_KEY_DIR:target/jwt-keys}

# ------------------------------------------------------------------ sessions
notehive.session.default-ttl=PT24H
notehive.session.remember-me-ttl=PT72H
notehive.session.idle-window=PT30M
notehive.session.access-token-ttl=PT15M
notehive.session.login-rate-limit=5
notehive.session.login-rate-window=PT1M
notehive.session.register-rate-limit=3
notehive.session.register-rate-window=PT1H
notehive.session.ws-connect-rate-limit=20
notehive.session.ws-connect-rate-window=PT1M
notehive.session.secure-cookies=${NOTEHIVE_SECURE_COOKIES:false}

# ------------------------------------------------------------- cache TTLs
# central registry — do not scatter expirations in code ("only if necessary")
notehive.cache.note=PT10M
notehive.cache.membership=PT60S
notehive.cache.profile=PT5M
notehive.cache.idempotency=P1D
notehive.cache.version-counter=P30D
notehive.cache.gzip-threshold=256

# --------------------------------------------------------------- rate limits
notehive.limits.read-per-minute=300
notehive.limits.write-per-minute=60
notehive.limits.write-window=PT1M

# -------------------------------------------------------------------- notes
notehive.notes.default-page-size=50
notehive.notes.max-page-size=100
notehive.notes.compression-threshold=512
notehive.notes.max-body-chars=1000000

# ------------------------------------------------------------------- bloom
notehive.bloom.expected-entries=1000000
notehive.bloom.fpp=0.01

# ------------------------------------------------------------------ webhooks
notehive.webhooks.enabled=true
notehive.webhooks.timeout=5s
notehive.webhooks.max-attempts=3
notehive.webhooks.backoff-base=1s

# ------------------------------------------------------------------- crypto
# 32-byte base64 keys; REQUIRED in production (fail-closed when missing)
notehive.crypto.aes-key=${NOTEHIVE_CRYPTO_AES_KEY:}
notehive.crypto.cursor-hmac-key=${NOTEHIVE_CRYPTO_CURSOR_KEY:}
notehive.crypto.pbkdf2-iterations=210000

# --------------------------------------------------------------- observability
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.otel.service.name=notehive
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4317}
quarkus.otel.traces.enabled=${NOTEHIVE_OTEL_ENABLED:false}
quarkus.log.level=INFO
quarkus.log.category."com.notehive".level=INFO
# never log request bodies or credentials
quarkus.http.access-log.enabled=false

# ------------------------------------------------------------------ http
quarkus.http.port=${QUARKUS_HTTP_PORT:8080}
quarkus.http.limits.max-body-size=2M
quarkus.shutdown.timeout=30S
# data compression: gzip JSON responses on the wire
quarkus.http.compression-level=6
quarkus.http.compress-media-types=text/html,text/plain,text/css,application/javascript,application/json
# CORS locked down by default; set origins explicitly when a web client exists
quarkus.http.cors.enabled=false

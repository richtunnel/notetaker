# Template only — real values come from your secret manager; never commit them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: notehive-config
data:
  QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres:5432/notehive"
  NOTEHIVE_REDIS_URL: "redis://redis:6379/0"
  NOTEHIVE_JWT_KEY_MODE: "jwks"           # SSO/Keycloak mode
  NOTEHIVE_JWT_JWKS_URL: "https://keycloak.example.com/realms/notehive/protocol/openid-connect/certs"
  NOTEHIVE_JWT_ISSUER: "https://keycloak.example.com/realms/notehive"
  NOTEHIVE_JWT_AUDIENCE: "notehive-api"
  NOTEHIVE_SECURE_COOKIES: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: notehive-secrets
type: Opaque
stringData:
  QUARKUS_DATASOURCE_USERNAME: "REPLACE_ME"
  QUARKUS_DATASOURCE_PASSWORD: "REPLACE_ME"
  QUARKUS_FLYWAY_USERNAME: "REPLACE_ME"     # notehive_migrator
  QUARKUS_FLYWAY_PASSWORD: "REPLACE_ME"
  NOTEHIVE_WORKER_DB_USERNAME: "REPLACE_ME" # notehive_worker
  NOTEHIVE_WORKER_DB_PASSWORD: "REPLACE_ME"
  NOTEHIVE_CRYPTO_AES_KEY: "REPLACE_ME"     # base64 32 bytes (webhook secrets at rest)
  NOTEHIVE_CRYPTO_CURSOR_KEY: "REPLACE_ME"  # base64 32 bytes (pagination cursor HMAC)

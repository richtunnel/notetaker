apiVersion: v1
kind: Service
metadata:
  name: notehive
  labels: { app: notehive }
spec:
  selector: { app: notehive }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notehive
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: notehive }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # no thrash while stream PELs drain

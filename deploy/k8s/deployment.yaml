apiVersion: apps/v1
kind: Deployment
metadata:
  name: notehive
  labels: { app: notehive }
spec:
  replicas: 2
  selector:
    matchLabels: { app: notehive }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } # zero-downtime; graceful drain
  template:
    metadata:
      labels: { app: notehive }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /q/metrics
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 45   # > quarkus.shutdown.timeout=30S
      containers:
        - name: app
          image: notehive/app:0.1.0       # replace with your registry path
          ports: [ { containerPort: 8080 } ]
          envFrom:
            - configMapRef: { name: notehive-config }
            - secretRef: { name: notehive-secrets }
          env:
            - name: HOSTNAME              # unique stream consumer id per replica
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "2", memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /q/health/ready, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /q/health/live, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /opt/notehive/tmp } # JWT dev keys in dev only
      volumes:
        - name: tmp
          emptyDir: {}
